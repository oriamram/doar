# Runs every app's checks on every push: types, lint, and the checks of the pure parts
# (for Doar: sorting rules, notification encryption, codes, hours, tickets, kinds of mail).
# The screen checks need a browser and are run before each deploy (npm run check:ui in an app's folder).
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
