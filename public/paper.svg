<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420">
  <!-- Old paper: soft brown foxing stains plus fine horizontal fibers.
       Transparent where clean, so it tints whatever paper color sits beneath. -->
  <filter id="stains" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.47  0 0 0 0 0.34  0 0 0 0 0.16  1.6 0 0 0 -0.78"/>
  </filter>
  <filter id="fibers" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.31  0 0 0 0 0.15  1.4 0 0 0 -0.72"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#stains)" opacity="0.55"/>
  <rect width="100%" height="100%" filter="url(#fibers)" opacity="0.4"/>
</svg>
