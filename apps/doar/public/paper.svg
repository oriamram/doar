<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Paper surface, used with background-blend-mode: multiply over a paper color.
       Near-white everywhere, so it only adds what real paper has:
       1. tooth: a fine relief lit from the top-left (lighting over noise);
       2. formation: faint, cloudy unevenness in the pulp.
       No stains: age is shown with color and edge shading instead. -->
  <filter id="tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="2" stitchTiles="stitch" result="noise"/>
    <feDiffuseLighting in="noise" surfaceScale="0.9" diffuseConstant="1" lighting-color="#ffffff">
      <feDistantLight azimuth="225" elevation="62"/>
    </feDiffuseLighting>
    <!-- A flat surface comes out at about 0.88; lift that to white and keep only
         shallow dips (at most a few percent darker). -->
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.17" intercept="0.851"/>
      <feFuncG type="linear" slope="0.17" intercept="0.850"/>
      <feFuncB type="linear" slope="0.17" intercept="0.846"/>
    </feComponentTransfer>
  </filter>
  <filter id="formation" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.60  0 0 0 0 0.50  0 0 0 0 0.34  -2.4 0 0 0 1.25"/>
  </filter>
  <rect width="360" height="360" filter="url(#tooth)"/>
  <rect width="360" height="360" filter="url(#formation)" opacity="0.03"/>
</svg>
